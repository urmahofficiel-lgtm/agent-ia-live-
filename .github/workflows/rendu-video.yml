# Rendu des vidéos animées HyperFrames (accord de Younes du 02/11/2026).
# Toutes les 10 minutes en journée : si le moteur a préparé des vidéos, le
# robot les filme (rendu-video/rendre.mjs) et dépose les MP4.
name: Rendu des vidéos animées

on:
  schedule:
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendu-video
  cancel-in-progress: false

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_TICK_SECRET: ${{ secrets.AGENT_TICK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vidéos à rendre
        id: file
        run: node --experimental-strip-types rendu-video/rendre.mjs --compter
      - name: FFmpeg
        if: steps.file.outputs.a_rendre != '0'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Rendu
        if: steps.file.outputs.a_rendre != '0'
        run: node --experimental-strip-types rendu-video/rendre.mjs
