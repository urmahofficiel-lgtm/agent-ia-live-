# Rendu des vidéos animées HyperFrames (accord de Younes du 02/11/2026).
# Toutes les 10 minutes en journée : si le moteur a préparé des vidéos, le
# robot les filme (rendu-video/rendre.mjs) et dépose les MP4.
name: Rendu des vidéos animées

on:
  schedule:
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendu-video
  cancel-in-progress: false

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDU_VIDEO_CLE: ${{ secrets.RENDU_VIDEO_CLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vidéos à rendre
        id: file
        run: node --experimental-strip-types rendu-video/rendre.mjs --compter
      # FFmpeg : binaire statique (rapide, sans dépendre des miroirs apt qui
      # bloquent parfois), apt en secours ; jamais plus de 6 minutes.
      - name: FFmpeg
        if: steps.file.outputs.a_rendre != '0'
        timeout-minutes: 6
        run: |
          command -v ffmpeg && exit 0
          if curl -fsSL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz; then
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Rendu
        if: steps.file.outputs.a_rendre != '0'
        run: node --experimental-strip-types rendu-video/rendre.mjs
